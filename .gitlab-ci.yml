image: gcc:latest

stages:
  - build
  - test

variables:
  CMAKE_BUILD_TYPE: "Release"

build:
  stage: build
  script:
    - apt-get update -qq && apt-get install -y cmake
    - mkdir -p build
    - cmake -S . -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=$CMAKE_BUILD_TYPE
    - cmake --build build --parallel 2
  artifacts:
    paths:
      - build/
    expire_in: 1 week

test:
  stage: test
  script:
    - echo "<html><body><h1>Test Results</h1><pre>" > report.html
    - ./build/HashTest >> report.html 2>&1
    - echo "</pre></body></html>" >> report.html
  dependencies:
    - build
  artifacts:
    paths:
      - report.html
    expose_as: "Test Report"
    expire_in: 1 week