image: gcc:latest

stages:
  - build
  - test

variables:
  CMAKE_BUILD_TYPE: "Release"

build:
  stage: build
  script:
    - apt-get update -qq && apt-get install -y cmake
    - mkdir -p build
    - cmake -S . -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=$CMAKE_BUILD_TYPE
    - cmake --build build --parallel 2
  artifacts:
    paths:
      - build/
    expire_in: 1 week

test:
  stage: test
  script:
    - |
      echo "<html><body>
      <h1>Pipeline Results</h1>

      <h2>Algorithm Output</h2>
      <pre>" > report.html
    - ./build/App >> report.html 2>&1
    - |
      echo "</pre>
      <h2>Test Results</h2>
      <pre>" >> report.html
    - ./build/HashTest >> report.html 2>&1
    - echo "</pre></body></html>" >> report.html
  dependencies:
    - build
  artifacts:
    paths:
      - report.html
    expose_as: "Full Report"
    expire_in: 1 week