image: gcc:latest

stages:
  - build
  - test

variables:
  CMAKE_BUILD_TYPE: "Release"

build:
  stage: build
  script:
    - apt-get update -qq && apt-get install -y cmake
    - mkdir -p build
    - cmake -S . -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=$CMAKE_BUILD_TYPE
    - cmake --build build --parallel 2
  artifacts:
    paths:
      - build/
    expire_in: 1 week

test:
  stage: test
  script:
    - ./build/HashTest
  dependencies:
    - build